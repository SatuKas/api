name: Build and Deploy to VPS

on:
  # push:
  #   branches:
  #     - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-dev:
    runs-on: ubuntu-latest
    environment: deploy-dev
    env:
      VPS_APP_DIR: /home/${{ secrets.VPS_USER }}/satukas-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22' # Sesuaikan dengan versi node.js lo

      - name: Setup PNPM
        uses: pnpm/action-setup@v2
        with:
          version: 10.9.0

      - name: Install dependencies
        run: |
          pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma:generate

      - name: Build NestJS application
        run: |
          pnpm build

      - name: Upload build to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: 'dist/**,package.json,pnpm-lock.yaml,prisma/**'
          target: ${{ env.VPS_APP_DIR }}

      - name: Upload .env to VPS
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cat > ${{ env.VPS_APP_DIR }}/.env <<'EOF'
            ${{ secrets.ENV_DEV }}
            EOF

      - name: Run application on VPS
        uses: appleboy/ssh-action@v0.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            export NVM_DIR="$HOME/.nvm"
            source "$NVM_DIR/nvm.sh"
            source "$NVM_DIR/bash_completion"
            cd ${{ env.VPS_APP_DIR }}
            rm -rf node_modules
            pnpm install
            pnpm prisma:generate
            pm2 restart satukas-api || pm2 start dist/main.js --name satukas-api
            pm2 save

      # Step baru buat nambahin label ke PR
      - name: Add label to PR
        if: success()
        run: |
          # Cari PR yang sudah di-merge berdasarkan commit SHA
          PR_NUMBER=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].number' || echo "")
          if [ ! -z "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "Found PR #$PR_NUMBER, adding label..."
            gh pr edit $PR_NUMBER --add-label "release-dev" || echo "Label already exists or PR not found"
          else
            echo "No PR found for commit ${{ github.sha }}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
